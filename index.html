<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard del Curso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .content-section {
        display: none;
      }
      .content-section.active {
        display: block;
        animation: fadeIn 0.3s ease-in;
      }

      .submenu {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .submenu.open {
        max-height: 1000px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      details summary::-webkit-details-marker {
        display: none;
      }
      summary {
        list-style: none;
      }
    </style>
</head>
<body class="flex h-screen bg-gray-50 text-gray-800">
    <div
      id="overlay"
      onclick="toggleSidebar()"
      class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"
    ></div>

    <aside
      id="sidebar"
      class="fixed inset-y-0 left-0 w-72 bg-indigo-900 text-white flex flex-col shadow-xl z-50 transition-transform -translate-x-full lg:translate-x-0 lg:static shrink-0"
    >
      <button
        id="openMobileMenu"
        onclick="toggleSidebar()"
        class="lg:hidden fixed top-4 left-4 z-50 bg-indigo-600 text-white p-2 rounded-lg shadow-lg"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16m-7 6h7"
          />
        </svg>
      </button>

      <div class="p-6 border-b border-indigo-800 flex justify-between items-center">
        <h1 id="sidebar-course-title" class="font-bold text-lg leading-tight uppercase tracking-wider">
          Curso
        </h1>
        <button onclick="toggleSidebar()" class="lg:hidden text-white text-2xl">
          ✕
        </button>
      </div>

      <nav id="nav-container" class="flex-1 overflow-y-auto p-4 space-y-2">
      </nav>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
      <header class="bg-indigo-900 text-white p-4 flex items-center lg:hidden">
        <button onclick="toggleSidebar()" class="text-2xl mr-4">☰</button>
        <span id="header-course-title" class="font-bold">Dashboard del Curso</span>
      </header>

      <main id="main-content" class="flex-1 overflow-y-auto p-6 md:p-12 bg-white">
      </main>
    </div>

<script>
const course = {"course_title": "Online: Effiziente KI-Tools für Ihren Arbeitsalltag", "course_subtitle": "Willkommen zum KI-Training für den Arbeitsalltag", "modules": [{"title": "Módulo 1: Fundamentos", "description": "Dauer: 3 Stunden", "lessons": [{"title": "¿Qué es la inteligencia artificial?", "content": "La inteligencia artificial permite que los sistemas informáticos realicen tareas que normalmente requieren capacidades humanas."}, {"title": "Limitaciones de la IA", "content": "Los sistemas de IA pueden cometer errores, inventar información o interpretar mal una instrucción."}]}, {"title": "Módulo 2: Prompting", "description": "Dauer: 3 Stunden", "lessons": [{"title": "La estructura de un buen prompt", "content": "Un buen prompt especifica el rol, la tarea, el contexto y el formato deseado."}]}, {"title": "test2", "description": "Dauer: 3 Std.", "lessons": []}]};

document.getElementById("sidebar-course-title").textContent = course.course_title;
document.getElementById("header-course-title").textContent = course.course_title;

function toggleSubmenu(id) {
  const menu = document.getElementById(id);
  const icon = document.getElementById("icon-" + id);
  menu.classList.toggle("open");
  if (icon) {
    icon.style.transform = menu.classList.contains("open")
      ? "rotate(180deg)"
      : "rotate(0deg)";
  }
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("-translate-x-full");
  document.getElementById("overlay").classList.toggle("hidden");
}

function showSection(id) {
  document.querySelectorAll(".content-section").forEach((s) => s.classList.remove("active"));
  const target = document.getElementById(id);
  if (target) target.classList.add("active");

  if (window.innerWidth < 1024) {
    document.getElementById("sidebar").classList.add("-translate-x-full");
    document.getElementById("overlay").classList.add("hidden");
  }
  document.getElementById("main-content").scrollTop = 0;
}

function buildUI() {
  const nav = document.getElementById("nav-container");
  const main = document.getElementById("main-content");

  let navHTML = `
    <button
      onclick="showSection('welcome-section')"
      class="w-full text-left p-3 font-bold text-white hover:bg-indigo-800 rounded-lg transition border border-indigo-700 uppercase"
    >
      📢 WILLKOMMEN
    </button>
  `;

  let mainHTML = `
    <article id="welcome-section" class="content-section active max-w-4xl mx-auto px-4 sm:px-0">
      <h2 class="text-2xl md:text-3xl font-black mb-10 text-indigo-900 border-b-4 border-indigo-600 pb-2 uppercase tracking-tight">
        ${course.course_title}
      </h2>
      <div class="bg-blue-50 p-6 md:p-10 rounded-2xl md:rounded-3xl border border-blue-100 shadow-sm">
        <p class="text-xl text-blue-900 font-medium italic mb-4">
          ${course.course_subtitle}
        </p>
        <p class="text-blue-800">
          Utiliza el menú de la izquierda para navegar por los módulos y lecciones del curso.
        </p>
      </div>
    </article>
  `;

  course.modules.forEach((module, mIdx) => {
    const menuId = `module-menu-${mIdx}`;
    const sectionId = `module-section-${mIdx}`;

    navHTML += `
      <div class="mb-4">
        <button
          onclick="toggleSubmenu('${menuId}')"
          class="w-full text-left p-3 font-bold text-white bg-indigo-700 hover:bg-indigo-600 rounded-lg transition flex justify-between items-center shadow-inner uppercase"
        >
          <span>📅 ${module.title}</span>
          <svg
            id="icon-${menuId}"
            class="w-4 h-4 transition-transform"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
        <div id="${menuId}" class="submenu space-y-1 pl-2 bg-indigo-900/50 rounded-b-lg">
          <button
            onclick="showSection('${sectionId}')"
            class="w-full text-left p-3 text-sm text-white hover:bg-indigo-800 rounded-lg transition flex justify-between items-center mt-1 border-l-2 border-indigo-500 bg-indigo-800/50"
          >
            <span>Ver Módulo Completo</span>
            ${module.description ? `<span class="text-[10px] bg-indigo-600 px-2 py-0.5 rounded shadow-sm">${module.description}</span>` : ''}
          </button>
        </div>
      </div>
    `;

    mainHTML += `
      <article id="${sectionId}" class="content-section max-w-4xl mx-auto">
        <div class="mb-10">
          <h2 class="text-3xl font-black text-indigo-950 uppercase tracking-tighter">
            ${module.title}
          </h2>
          ${module.description ? `<div class="mt-2 inline-block bg-indigo-100 text-indigo-700 px-4 py-1 rounded-full font-bold">${module.description}</div>` : ''}
        </div>
        <div class="space-y-6">
    `;

    module.lessons.forEach((lesson, lIdx) => {
      mainHTML += `
        <details class="group bg-slate-50 rounded-3xl border border-slate-200 overflow-hidden shadow-sm" ${lIdx === 0 ? 'open' : ''}>
          <summary class="flex items-center justify-between p-6 cursor-pointer list-none bg-slate-100 hover:bg-slate-200 transition-colors">
            <h3 class="text-2xl font-bold text-indigo-900">
              ${lesson.title}
            </h3>
            <span class="transition-transform duration-300 group-open:rotate-180">
              <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" class="text-indigo-900">
                <path d="M6 9l6 6 6-6"></path>
              </svg>
            </span>
          </summary>
          <div class="p-8 pt-4">
            <div class="text-slate-700 leading-relaxed whitespace-pre-wrap font-sans text-base">
              ${lesson.content}
            </div>
          </div>
        </details>
      `;
    });

    mainHTML += `
        </div>
      </article>
    `;
  });

  navHTML += `
    <button
      onclick="showSection('about-section')"
      class="w-full text-left p-3 font-bold text-white hover:bg-indigo-800 rounded-lg transition border border-white/10 flex items-center group bg-indigo-950/40 shadow-sm uppercase mt-6"
    >
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5 text-red-500 filter drop-shadow-[0_0_3px_rgba(239,68,68,0.5)]" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
        </svg>
        <span class="tracking-wide uppercase">Über mich</span>
      </div>
    </button>
  `;

  mainHTML += `
    <article id="about-section" class="content-section max-w-4xl mx-auto">
      <div class="flex flex-col items-center justify-center min-h-[400px] gap-8 py-10">
        <h3 class="text-2xl font-bold text-indigo-900">Über mich</h3>
        <p class="text-slate-600 text-center max-w-md">
          Información sobre el instructor o creador del curso.
        </p>
      </div>
    </article>
  `;

  nav.innerHTML = navHTML;
  main.innerHTML = mainHTML;
}

buildUI();
</script>
</body>
</html>
